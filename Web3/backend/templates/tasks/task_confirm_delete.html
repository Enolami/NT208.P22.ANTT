{% extends 'base.html' %}

{% block title %}Delete Task - Smart Scheduler{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
            <h2 class="text-xl font-semibold text-gray-900 dark:text-white">Delete Task</h2>
        </div>
        
        <div class="p-6">
            <div class="mb-6">
                <p class="text-gray-600 dark:text-gray-300">
                    Are you sure you want to delete the task "{{ task.task_name }}"?
                </p>
                <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
                    This action cannot be undone.
                </p>
            </div>
            
            <form method="post" class="flex justify-end space-x-3">
                {% csrf_token %}
                <a href="{% url 'tasks:task_list' %}" class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    Cancel
                </a>
                <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                    Delete Task
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
