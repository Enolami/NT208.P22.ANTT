{% extends 'base.html' %}

{% block title %}Delete Calendar Sync{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title mb-0">Delete Calendar Sync</h3>
            </div>
            <div class="card-body">
                <p class="card-text">Are you sure you want to delete the calendar sync for "{{ sync.calendar_name }}"?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger">Confirm Delete</button>
                        <a href="{% url 'calendarsync:sync_list' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
